[project]
name = "coursework-support"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "jinja2>=3.1,<4",
  "argon2-cffi>=25.1,<26",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyyaml>=6,<7", "jsonschema>=4,<5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
