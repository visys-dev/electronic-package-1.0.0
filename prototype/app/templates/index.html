<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Служба технічної підтримки</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><header><h1>Технічна підтримка</h1><span id="identity"></span><button id="logout" hidden>Вийти</button></header>
<main><p id="status" role="status" aria-live="polite"></p>
<section id="login-panel"><h2>Вхід</h2><form id="login"><label>Логін<input name="login" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Увійти</button></form></section>
<div id="workspace" hidden>
<section id="create-panel"><h2>Нова заявка</h2><p>Не додавайте паролі, токени та надлишкові персональні дані.</p><form id="create"><label>Тема<input name="title" required></label><label>Опис<textarea name="description" required></textarea></label><label>Категорія<select name="categoryId" required></select></label><button>Створити</button></form></section>
<section><h2>Доступні заявки</h2><button id="refresh">Оновити список</button><ul id="tickets"></ul><button id="more-tickets" hidden>Ще заявки</button></section>
<section id="card" hidden tabindex="-1"><h2 id="ticket-heading"></h2><p id="ticket-details"></p><p id="ticket-description"></p>
<form id="assignment" hidden><label>Виконавець<select name="assigneeId" required></select></label><button>Призначити</button></form>
<button id="start" hidden>Взяти в роботу</button>
<form id="solution" hidden><label>Публічне рішення<textarea name="text" required></textarea></label><button>Позначити вирішеною</button></form>
<button id="confirm" hidden>Підтвердити рішення та закрити</button>
<h3>Публічні повідомлення</h3><ul id="comments"></ul><button id="more-comments" hidden>Ще повідомлення</button>
<form id="comment"><label>Коментар<textarea name="body" required></textarea></label><button>Надіслати</button></form>
<h3>Історія</h3><ul id="history"></ul><button id="more-history" hidden>Ще події</button>
</section></div></main></body></html>
