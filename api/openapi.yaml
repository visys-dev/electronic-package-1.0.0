components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: support_session
      description: Випадковий непрозорий токен; Secure, HttpOnly, SameSite=Strict. Сервер перевіряє active на кожному запиті.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 500
        correlationId: *id002
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 100
              message:
                type: string
                minLength: 1
                maxLength: 300
            required:
            - field
            - message
      required:
      - code
      - message
      - correlationId
      - fieldErrors
    Ticket:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        number: *id035
        requesterId: *id002
        categoryId: *id002
        queueId: *id002
        assigneeId: &id039
          anyOf:
          - *id002
          - type: 'null'
        previousTicketId:
          anyOf:
          - *id002
          - type: 'null'
        title: &id038
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          minLength: 1
          maxLength: 4000
        priority: &id040
          type: string
          enum:
          - low
          - normal
          - high
          - critical
        state: *id036
        responseTargetMs: *id035
        resolutionTargetMs: *id035
        createdAt: &id037
          type: string
          format: date-time
          pattern: Z$
        updatedAt: *id037
        firstAssignedAt:
          anyOf:
          - *id037
          - type: 'null'
        firstResponseAt:
          anyOf:
          - *id037
          - type: 'null'
        solutionCommentId:
          anyOf:
          - *id002
          - type: 'null'
        version: *id035
      required:
      - id
      - number
      - requesterId
      - categoryId
      - queueId
      - assigneeId
      - previousTicketId
      - title
      - description
      - priority
      - state
      - responseTargetMs
      - resolutionTargetMs
      - createdAt
      - updatedAt
      - firstAssignedAt
      - firstResponseAt
      - solutionCommentId
      - version
    TicketSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        number: *id035
        title: *id038
        categoryId: *id002
        queueId: *id002
        assigneeId: *id039
        priority: *id040
        state: *id036
        createdAt: *id037
        version: *id035
      required:
      - id
      - number
      - title
      - categoryId
      - queueId
      - assigneeId
      - priority
      - state
      - createdAt
      - version
    TicketPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
      required:
      - items
      - nextCursor
    CreateTicketRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          minLength: 1
          maxLength: 4000
        categoryId: *id002
        previousTicketId: *id002
      required:
      - title
      - description
      - categoryId
    AssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: *id035
        assigneeId: *id002
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - expectedVersion
      - assigneeId
    PriorityRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: *id035
        priority: *id040
      required:
      - expectedVersion
      - priority
    StateRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: *id035
        toState:
          type: string
          enum:
          - in_progress
          - waiting_requester
          - resolved
          - closed
        text:
          type: string
          minLength: 1
          maxLength: 2000
        solutionCommentId: *id002
      required:
      - expectedVersion
      - toState
    CommentRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: *id035
        body:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          type: string
          enum:
          - public
          - internal
      required:
      - expectedVersion
      - body
      - visibility
    Comment:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        ticketId: *id002
        authorId: *id002
        createdAt: *id037
        body:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          type: string
          enum:
          - public
          - internal
        kind:
          type: string
          enum:
          - comment
          - clarification
          - solution
          - rejection
          - resume_reason
      required:
      - id
      - ticketId
      - authorId
      - createdAt
      - body
      - visibility
      - kind
    CommentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
