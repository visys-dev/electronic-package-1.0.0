openapi: 3.1.1
info:
  title: API системи управління заявками технічної підтримки
  version: 0.1.0
  description: 'Проєктний контракт; не підтверджує наявності сервера. Повний обсяг US-01–US-10. JSON, UTC, серверна авторизація.
    Нормалізація тексту trim до перевірки довжини. Всі відповіді захищених ресурсів Cache-Control: no-store. Відповіді не
    включають хеші паролів, внутрішні нотатки заявнику чи чужі дані.'
servers:
- url: https://support.example.invalid/api/v1
  description: Умовна адреса для опису; робочий сервер не розгорнуто.
security:
- sessionCookie: []
paths:
  /session:
    post:
      operationId: API-LOGIN
      summary: Локальний вхід
      description: 'Доступ: Неавтентифікований користувач. До входу перевіряються Origin і same-origin. Помилка облікових
        даних — узагальнена 401. Паролі й токени не журналюються. Політика паролів і throttling деталізується у 2.3.'
      x-requirements: []
      responses:
        '200':
          description: Успіх
          headers: &id001
            X-Correlation-ID:
              schema: &id002
                type: string
                format: uuid
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description: support_session=<opaque>; Secure; HttpOnly; SameSite=Strict; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Некоректний JSON або параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
        '401':
          description: Сеанс відсутній, прострочений, відкликаний або користувач неактивний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
        '403':
          description: Дія заборонена або не пройдено CSRF/Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
        '404':
          description: Ресурс відсутній або недоступний; без розкриття існування чужого ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
        '409':
          description: Конфлікт версії, стану, повтору або адміністративного обмеження
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
        '422':
          description: Семантична помилка поля або бізнес-умов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
        '503':
          description: Сховище тимчасово недоступне; зміни не підтверджені
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
    get:
      operationId: API-ME
      summary: Поточний сеанс
      description: 'Доступ: Активний користувач.'
      x-requirements: []
      responses:
        '200':
          description: Успіх
          headers: &id003
            X-Correlation-ID:
              schema: *id002
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Некоректний JSON або параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id003
        '401':
          description: Сеанс відсутній, прострочений, відкликаний або користувач неактивний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id003
        '403':
          description: Дія заборонена або не пройдено CSRF/Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id003
        '404':
          description: Ресурс відсутній або недоступний; без розкриття існування чужого ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id003
        '503':
          description: Сховище тимчасово недоступне; зміни не підтверджені
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id003
    delete:
      operationId: API-LOGOUT
      summary: Відкликати поточний сеанс
      description: 'Доступ: Активний користувач. Сервер відкликає сеанс та очищує cookie.'
      x-requirements: []
      responses:
        '204':
          description: Успіх
          headers: &id004
            X-Correlation-ID:
              schema: *id002
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: Некоректний JSON або параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
        '401':
          description: Сеанс відсутній, прострочений, відкликаний або користувач неактивний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
        '403':
          description: Дія заборонена або не пройдено CSRF/Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
        '404':
          description: Ресурс відсутній або недоступний; без розкриття існування чужого ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
        '409':
          description: Конфлікт версії, стану, повтору або адміністративного обмеження
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
        '422':
          description: Семантична помилка поля або бізнес-умов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
        '503':
          description: Сховище тимчасово недоступне; зміни не підтверджені
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id004
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Токен активного сеансу; також перевіряються Origin і same-origin.
  /tickets:
    post:
      operationId: API-01
      summary: Створити заявку
      description: 'Доступ: Заявник. requesterId визначає сервер; normal; new; черга з категорії. previousTicketId — лише
        власна доступна closed-заявка. Дозволена категорія/черга/політика та цілі перевіряються в транзакції. Порожній текст
        після trim — 422.'
      x-requirements:
      - US-01
      responses:
        '201':
          description: Успіх
          headers: &id005
            X-Correlation-ID:
              schema: *id002
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              schema:
                type: string
              description: URI створеної заявки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              example:
                id: 00000000-0000-4000-8000-000000001001
                number: 1
                requesterId: 00000000-0000-4000-8000-000000000001
                categoryId: 00000000-0000-4000-8000-000000000301
                queueId: 00000000-0000-4000-8000-000000000201
                assigneeId: null
                previousTicketId: null
                title: Не працює друк
                description: Документ не надходить до принтера.
                priority: normal
                state: new
                responseTargetMs: 1800000
                resolutionTargetMs: 7200000
                createdAt: '2026-10-25T10:00:00.000Z'
                updatedAt: '2026-10-25T10:00:00.000Z'
                firstAssignedAt: null
                firstResponseAt: null
                solutionCommentId: null
                version: 1
        '200':
          description: 'Повтор: та сама заявка без дубля; поточне дозволене представлення після повторної авторизації.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers: *id005
        '400':
          description: Некоректний JSON або параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id005
        '401':
          description: Сеанс відсутній, прострочений, відкликаний або користувач неактивний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id005
        '403':
          description: Дія заборонена або не пройдено CSRF/Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id005
        '404':
          description: Ресурс відсутній або недоступний; без розкриття існування чужого ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id005
        '409':
          description: Конфлікт версії, стану, повтору або адміністративного обмеження
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id005
        '422':
          description: Семантична помилка поля або бізнес-умов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Перевірте заповнення полів.
                correlationId: 00000000-0000-4000-8000-000000008002
                fieldErrors:
                - field: title
                  message: Вкажіть тему заявки.
          headers: *id005
        '503':
          description: Сховище тимчасово недоступне; зміни не підтверджені
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id005
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Токен активного сеансу; також перевіряються Origin і same-origin.
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id002
        description: Проєктний ключ повтору створення; не твердження про стандартизацію заголовка.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
            example:
              title: Не працює друк
              description: Документ не надходить до принтера.
              categoryId: 00000000-0000-4000-8000-000000000301
    get:
      operationId: API-02
      summary: Список доступних заявок
      description: 'Доступ: Заявник, спеціаліст, координатор. Фільтри застосовуються тільки після обмеження дозволених заявок.
        Порядок createdAt,id; cursor непрозорий і перевірений сервером.'
      x-requirements:
      - US-02
      responses:
        '200':
          description: Успіх
          headers: &id006
            X-Correlation-ID:
              schema: *id002
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          description: Некоректний JSON або параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id006
        '401':
          description: Сеанс відсутній, прострочений, відкликаний або користувач неактивний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id006
        '403':
          description: Дія заборонена або не пройдено CSRF/Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id006
        '404':
          description: Ресурс відсутній або недоступний; без розкриття існування чужого ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id006
        '503':
          description: Сховище тимчасово недоступне; зміни не підтверджені
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id006
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 300
      - name: number
        in: query
        required: false
        schema: &id035
          type: integer
          minimum: 1
      - name: state
        in: query
        required: false
        schema: &id036
          type: string
          enum:
          - new
          - assigned
          - in_progress
          - waiting_requester
          - resolved
          - closed
      - name: categoryId
        in: query
        required: false
        schema: *id002
      - name: assigneeId
        in: query
        required: false
        schema: *id002
  /tickets/{ticketId}:
    get:
      operationId: API-03
      summary: Картка доступної заявки
      description: 'Доступ: Власник або підтримка дозволеної черги.'
