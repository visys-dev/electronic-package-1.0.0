          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id007
      parameters:
      - name: ticketId
        in: path
        required: true
        schema: *id002
  /tickets/{ticketId}/assignment:
    post:
      operationId: API-04
      summary: Призначити або перепризначити
      description: 'Доступ: Координатор своєї черги. Перше призначення new→assigned; повторне потребує reason. Закрита заявка
        незмінна. expectedVersion захищає від конкурентної зміни.'
      x-requirements:
      - US-03
      responses:
        '200':
          description: Успіх
          headers: &id008
            X-Correlation-ID:
              schema: *id002
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Некоректний JSON або параметр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id008
        '401':
          description: Сеанс відсутній, прострочений, відкликаний або користувач неактивний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id008
        '403':
          description: Дія заборонена або не пройдено CSRF/Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id008
        '404':
          description: Ресурс відсутній або недоступний; без розкриття існування чужого ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id008
        '409':
          description: Конфлікт версії, стану, повтору або адміністративного обмеження
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VERSION_CONFLICT
                message: Заявку вже змінено. Оновіть її дані.
                correlationId: 00000000-0000-4000-8000-000000008001
                fieldErrors: []
          headers: *id008
        '422':
          description: Семантична помилка поля або бізнес-умов
