          minLength: 1
          maxLength: 256
        description: Токен активного сеансу; також перевіряються Origin і same-origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
  /tickets/{ticketId}/priority:
    post:
      operationId: API-05
      summary: Уточнити пріоритет
      description: 'Доступ: Координатор своєї черги. Тільки firstAssignedAt=null; до заміни цілей оцінюються старі порушення,
        createdAt зберігається.'
      x-requirements:
      - US-03
      responses:
        '200':
          description: Успіх
          headers: &id009
            X-Correlation-ID:
              schema: *id002
              description: Ідентифікатор для зіставлення з діагностичним журналом.
            Cache-Control:
              schema:
